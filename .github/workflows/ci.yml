name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --passWithNoTests

      # Non-blocking: generates coverage report for artifact upload.
      # The blocking gate is the validate:coverage step below.
      - name: Run tests with coverage
        run: npm run test:coverage -- --passWithNoTests
        continue-on-error: true

      - name: Validate recipe coverage
        run: npm run validate:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always() && hashFiles('coverage/**') != ''
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14
