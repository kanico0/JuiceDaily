<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 120" width="840" height="120" role="img" aria-label="RawLife Garden produce-color markers">
<!-- Six produce-color markers, in order: green, red, orange, yellow, purple, tan.
     Each marker_[key]_container holds three mutually-exclusive states
     (undiscovered / discovered / selected) as display-toggled groups.
     Discovered is shown by default here. Pair every marker with a native
     text label outside the SVG — do not rely on hue alone. -->
<g id="marker_green_container" transform="translate(0,0)"><g id="marker_green_undiscovered" style="display:none"><circle cx="70" cy="60" r="30" fill="none" stroke="#DDD6C7" stroke-width="2" stroke-dasharray="4 4"/><path d="M 70.0,74.0 Q 63.0,62.3 70.0,48.0 Q 77.0,62.3 70.0,74.0 Z" fill="none" opacity="1.0" stroke="#C9C2B0" stroke-width="3"/><path d="M 70.0,74.0 L 70.0,48.0" stroke="none" stroke-opacity="0.35" stroke-width="1" fill="none"/></g><g id="marker_green_discovered" style="display:inline"><circle cx="70" cy="60" r="30" fill="#FFFFFF"/><path d="M 70.0,74.0 Q 63.0,62.3 70.0,48.0 Q 77.0,62.3 70.0,74.0 Z" fill="#4C7A55" opacity="1.0"/><path d="M 70.0,74.0 L 70.0,48.0" stroke="#4C7A55" stroke-opacity="0.35" stroke-width="1" fill="none"/></g><g id="marker_green_selected" style="display:none"><circle cx="70" cy="60" r="34" fill="none" stroke="#4C7A55" stroke-width="3"/><circle cx="70" cy="60" r="30" fill="#FFFFFF"/><path d="M 70.0,74.0 Q 63.0,62.3 70.0,48.0 Q 77.0,62.3 70.0,74.0 Z" fill="#4C7A55" opacity="1.0"/><path d="M 70.0,74.0 L 70.0,48.0" stroke="#4C7A55" stroke-opacity="0.35" stroke-width="1" fill="none"/></g></g>
<g id="marker_red_container" transform="translate(140,0)"><g id="marker_red_undiscovered" style="display:none"><circle cx="70" cy="60" r="30" fill="none" stroke="#DDD6C7" stroke-width="2" stroke-dasharray="4 4"/><circle cx="70" cy="60" r="16" fill="none" stroke="#C9C2B0" stroke-width="3"/></g><g id="marker_red_discovered" style="display:inline"><circle cx="70" cy="60" r="30" fill="#FFFFFF"/><circle cx="70" cy="60" r="16" fill="#C4483A" stroke="none" stroke-width="3"/></g><g id="marker_red_selected" style="display:none"><circle cx="70" cy="60" r="34" fill="none" stroke="#C4483A" stroke-width="3"/><circle cx="70" cy="60" r="30" fill="#FFFFFF"/><circle cx="70" cy="60" r="16" fill="#C4483A" stroke="none" stroke-width="3"/></g></g>
<g id="marker_orange_container" transform="translate(280,0)"><g id="marker_orange_undiscovered" style="display:none"><circle cx="70" cy="60" r="30" fill="none" stroke="#DDD6C7" stroke-width="2" stroke-dasharray="4 4"/><path d="M 70,42 L 84,60 L 70,78 L 56,60 Z" fill="none" stroke="#C9C2B0" stroke-width="3"/></g><g id="marker_orange_discovered" style="display:inline"><circle cx="70" cy="60" r="30" fill="#FFFFFF"/><path d="M 70,42 L 84,60 L 70,78 L 56,60 Z" fill="#E8873A" stroke="none" stroke-width="3"/></g><g id="marker_orange_selected" style="display:none"><circle cx="70" cy="60" r="34" fill="none" stroke="#E8873A" stroke-width="3"/><circle cx="70" cy="60" r="30" fill="#FFFFFF"/><path d="M 70,42 L 84,60 L 70,78 L 56,60 Z" fill="#E8873A" stroke="none" stroke-width="3"/></g></g>
