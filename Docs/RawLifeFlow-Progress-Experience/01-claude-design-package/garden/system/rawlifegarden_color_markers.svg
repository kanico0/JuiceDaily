<g id="marker_purple_container" transform="translate(560,0)"><g id="marker_purple_undiscovered" style="display:none"><circle cx="70" cy="60" r="30" fill="none" stroke="#DDD6C7" stroke-width="2" stroke-dasharray="4 4"/><circle cx="62" cy="56" r="8" fill="none" stroke="#C9C2B0" stroke-width="2"/><circle cx="78" cy="56" r="8" fill="none" stroke="#C9C2B0" stroke-width="2"/><circle cx="70" cy="70" r="8" fill="none" stroke="#C9C2B0" stroke-width="2"/></g><g id="marker_purple_discovered" style="display:inline"><circle cx="70" cy="60" r="30" fill="#FFFFFF"/><circle cx="70.0" cy="60.0" r="8.0" fill="#7C5295"/><circle cx="79.0" cy="56.4" r="8.0" fill="#7C5295"/><circle cx="61.0" cy="57.3" r="8.0" fill="#7C5295"/></g><g id="marker_purple_selected" style="display:none"><circle cx="70" cy="60" r="34" fill="none" stroke="#7C5295" stroke-width="3"/><circle cx="70" cy="60" r="30" fill="#FFFFFF"/><circle cx="70.0" cy="60.0" r="8.0" fill="#7C5295"/><circle cx="79.0" cy="56.4" r="8.0" fill="#7C5295"/><circle cx="61.0" cy="57.3" r="8.0" fill="#7C5295"/></g></g>
