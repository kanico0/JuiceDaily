<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 120" width="840" height="120" role="img" aria-label="RawLife Garden produce discovery symbols">
<!-- Seven generic produce-family discovery symbols, 120x120 each, in document order:
     leafy, root, citrus, orchard, berry, tropical, herb.
     Each symbol_[key]_container has a documented center point at local (60,70)
     relative to its own tile origin, used as the animation anchor when the
     symbol travels toward its Garden bed in the discovery storyboard. -->
