plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'host.exp.exponent'
version = '1.0.0'

android {
  namespace "expo.modules.playintegrity"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  api "com.google.android.play:integrity:1.4.0"
}
